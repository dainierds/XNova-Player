name: Compilar APK Android TV / Fire TV

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Instalar Android SDK 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" 2>/dev/null || \
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Instalar Dependencias Web
        run: npm ci

      - name: Sincronizar Versión en Branding con GitHub Run
        run: |
          BUILD_VER="1.0.${{ github.run_number }}"
          echo "Actualizando versión a $BUILD_VER en branding.ts..."
          sed -i "s/version: '.*'/version: '$BUILD_VER'/" src/config/branding.ts
          cat src/config/branding.ts | grep version

      - name: Compilar Frontend React (Vite)
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Firmar y Renombrar APK
        id: sign_apk
        run: |
          mkdir -p build-output
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: No se encontró el APK generado."
            ls -la android/app/build/outputs/ || true
            exit 1
          fi

          echo "APK encontrado: $UNSIGNED_APK"
          SIGNED_APK="build-output/XNova-Player-AndroidTV.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          KEYSTORE_FILE="android/release.keystore"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "==> Firmando con Keystore secreto de GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            ALIAS="${{ secrets.KEY_ALIAS }}"
          elif [ -f "$KEYSTORE_FILE" ]; then
            echo "==> Usando Keystore Permanente existente ($KEYSTORE_FILE)..."
            KS_PASS="xnovapass2026"
            KEY_PASS="xnovapass2026"
            ALIAS="xnovatv"
          else
            echo "==> Generando Keystore Permanente oficial para XNova Player..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -alias xnovatv \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass xnovapass2026 \
              -keypass xnovapass2026 \
              -dname "CN=XNova Player, OU=TV, O=XNova, L=Miami, S=FL, C=US"

            KS_PASS="xnovapass2026"
            KEY_PASS="xnovapass2026"
            ALIAS="xnovatv"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_FILE"
            git commit -m "chore(release): keystore permanente para actualizaciones OTA directas" || true
            git push origin main || true
          fi

          echo "==> Alineando APK con zipalign..."
          $ZIPALIGN -v -p 4 "$UNSIGNED_APK" aligned.apk

          echo "==> Firmando APK con apksigner (v2/v3 signing permanente)..."
          $APKSIGNER sign --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$ALIAS" \
            --out "$SIGNED_APK" aligned.apk

          echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Guardar APK como Artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: XNova-Player-AndroidTV
          path: build-output/XNova-Player-AndroidTV.apk
          if-no-files-found: error

      - name: Publicar GitHub Release con Descarga Directa
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "XNova Player v1.0.${{ github.run_number }} 📺 Android TV / Fire TV"
          body: |
            ## 📺 XNova Player — Descarga Directa

            **Instalar con Downloader:**
            - Abre **Downloader** en tu Fire TV / Android TV
            - Ingresa la URL directa del APK

            **URL directa del APK:**
            ```
            https://github.com/dainierds/XNova-Player/releases/latest/download/XNova-Player-AndroidTV.apk
            ```

            ---
            *Build automático v1.0.${{ github.run_number }} desde commit `${{ github.sha }}`*
          draft: false
          prerelease: false
          files: |
            build-output/XNova-Player-AndroidTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
