name: Compilar APK Android TV / Fire TV

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Instalar Android SDK 34
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Instalar Dependencias Web
        run: npm ci

      - name: Compilar Frontend React (Vite)
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Firmar y Renombrar APK
        id: sign_apk
        run: |
          mkdir -p build-output
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: No se encontró el APK generado."
            ls -la android/app/build/outputs/ || true
            exit 1
          fi

          echo "APK encontrado: $UNSIGNED_APK"
          SIGNED_APK="build-output/XNova-Player-AndroidTV.apk"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "==> Firmando con Keystore secreto de GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

            $ZIPALIGN -v -p 4 "$UNSIGNED_APK" aligned.apk
            $APKSIGNER sign --ks release.keystore \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --out "$SIGNED_APK" aligned.apk
          else
            echo "==> Generando keystore automático (sin secretos configurados)..."
            keytool -genkey -v \
              -keystore auto-release.keystore \
              -alias xnova \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass xnovapass \
              -keypass xnovapass \
              -dname "CN=XNova Player, OU=TV, O=XNova, L=Miami, S=FL, C=US"

            $ZIPALIGN -v -p 4 "$UNSIGNED_APK" aligned.apk
            $APKSIGNER sign --ks auto-release.keystore \
              --ks-pass "pass:xnovapass" \
              --key-pass "pass:xnovapass" \
              --ks-key-alias xnova \
              --out "$SIGNED_APK" aligned.apk
          fi

          echo "apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT

      - name: Guardar APK como Artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: XNova-Player-AndroidTV
          path: build-output/XNova-Player-AndroidTV.apk
          if-no-files-found: error

      - name: Publicar GitHub Release con Descarga Directa
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "XNova Player v1.0.${{ github.run_number }} 📺 Android TV / Fire TV"
          body: |
            ## 📺 XNova Player — Descarga Directa

            **Instalar con Downloader:**
            - Abre **Downloader** en tu Fire TV / Android TV
            - Ingresa la URL directa del APK

            **URL directa del APK:**
            ```
            https://github.com/dainierds/XNova-Player/releases/latest/download/XNova-Player-AndroidTV.apk
            ```

            ---
            *Build automático v1.0.${{ github.run_number }} desde commit `${{ github.sha }}`*
          draft: false
          prerelease: false
          files: |
            build-output/XNova-Player-AndroidTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
